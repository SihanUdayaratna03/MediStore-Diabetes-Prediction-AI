services:
  # -----------------------------------------------------
  # 1. V2 Diabetes Risk API (Port 8000)
  # -----------------------------------------------------
  backend-v2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medistore_backend_v2
    # Start the FastAPI server using Uvicorn
    command: uvicorn server:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      # This maps your local root folder to the container's /app folder
      # so changes to server.py reflect immediately without rebuilding
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1 # Ensures Python print statements show up immediately in logs

  # -----------------------------------------------------
  # 2. V3 Complication Risk API (Port 8001)
  # -----------------------------------------------------
  backend-v3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medistore_backend_v3
    command: uvicorn server_v3:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1

  # -----------------------------------------------------
  # 3. React Frontend (Port 5173)
  # -----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medistore_frontend
    ports:
      - "5173:5173"
    volumes:
      # Maps local frontend code to container so live-reload works
      - ./frontend:/app
      # Prevents local node_modules from overwriting the container's node_modules
      - /app/node_modules
    environment:
      # Tells Vite to use a polling mechanism for file changes (required for Windows + Docker live reload)
      - CHOKIDAR_USEPOLLING=true
